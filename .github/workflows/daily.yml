name: Daily stock screening
on:
  schedule:
    - cron: '40 10 * * 1-5' # 18:40 Taiwan time; exchange data may publish later
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python backend/scanner.py
      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          git diff --cached --quiet || (git commit -m 'Update daily screening results' && git push)
